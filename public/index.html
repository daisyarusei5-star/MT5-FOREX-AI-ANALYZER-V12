<script>
"use strict";

/* =========================================================
   MT5 FOREX AI ANALYZER V12.0.2
========================================================= */

const FRONTEND_VERSION = "12.0.2";


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function safeText(value, fallback="--"){
  if(value === undefined || value === null || value === ""){
    return fallback;
  }

  return String(value);
}

function percentage(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "0%";
  }

  return Math.round(n) + "%";
}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   STATE
========================================================= */

const state = {

  loggedIn:false,

  ws:null,

  reconnectTimer:null,

  reconnectDelay:2000,

  reconnecting:false,

  serverOnline:false,

  mt5Online:false,

  dashboard:null,

  candles:[],

  lastDashboardUpdate:0,

  paperPositions:[],

  selectedSymbol:"EURUSD",

  selectedTimeframe:"M1",

  loadingDashboard:false

};


/* =========================================================
   DOM READY
========================================================= */

document.addEventListener("DOMContentLoaded",()=>{

  console.log(
    "🔥 MT5 FOREX AI ANALYZER V" +
    FRONTEND_VERSION +
    " STARTING"
  );


  const version =
    $("frontendVersion");

  if(version){

    version.textContent =
      "V" +
      FRONTEND_VERSION +
      " • Dashboard";

  }


  /* Symbol */

  $("symbol")?.addEventListener(
    "change",
    ()=>{

      state.selectedSymbol =
        $("symbol").value;

      log(
        "Symbol changed to " +
        state.selectedSymbol,
        "info"
      );

      sendSubscription();

      requestDashboard();

    }
  );


  /* Timeframe */

  $("timeframe")?.addEventListener(
    "change",
    ()=>{

      state.selectedTimeframe =
        $("timeframe").value;

      log(
        "Timeframe changed to " +
        state.selectedTimeframe,
        "info"
      );

      sendSubscription();

      requestDashboard();

    }
  );


  /* Login */

  $("loginBtn")?.addEventListener(
    "click",
    login
  );


  $("password")?.addEventListener(
    "keydown",
    event=>{

      if(event.key === "Enter"){

        event.preventDefault();

        login();

      }

    }
  );


  /* Clear log */

  $("clearLog")?.addEventListener(
    "click",
    ()=>{

      $("logBox").innerHTML="";

      log(
        "Event log cleared.",
        "info"
      );

    }
  );


  /* Paper trade */

  $("paperTradeBtn")?.addEventListener(
    "click",
    createPaperTrade
  );


  /* Clear trades */

  $("clearTradeBtn")?.addEventListener(
    "click",
    ()=>{

      state.paperPositions=[];

      renderPositions();

      log(
        "Paper positions cleared.",
        "info"
      );

    }
  );


  window.addEventListener(
    "resize",
    ()=>{
      if(state.loggedIn){
        drawChart();
      }
    }
  );


  log(
    "Frontend V" +
    FRONTEND_VERSION +
    " initialized.",
    "info"
  );

  log(
    "Login required before dashboard connection.",
    "info"
  );

});


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  if(state.loggedIn){

    openDashboard();

    return;

  }


  const passwordElement =
    $("password");

  const loginButton =
    $("loginBtn");

  const loginError =
    $("loginError");


  const password =
    passwordElement.value.trim();


  loginError.textContent="";


  if(!password){

    loginError.textContent =
      "Enter your bot password.";

    return;

  }


  loginButton.disabled=true;

  loginButton.textContent =
    "🔄 LOGGING IN...";


  log(
    "Sending secure login request...",
    "info"
  );


  try{

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",

          credentials:"include",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:JSON.stringify({
            password:password
          }),

          cache:"no-store"
        }
      );


    const raw =
      await response.text();


    console.log(
      "LOGIN STATUS:",
      response.status
    );

    console.log(
      "LOGIN RAW:",
      raw
    );


    let data={};

    try{

      data =
        JSON.parse(raw);

    }catch(error){

      console.error(
        "Login JSON parse error:",
        error
      );

    }


    if(
      !response.ok ||
      data.success !== true
    ){

      loginError.textContent =
        data.message ||
        "Login failed.";

      log(
        "Login rejected: HTTP " +
        response.status,
        "error"
      );

      loginButton.disabled=false;

      loginButton.textContent =
        "🔐 LOGIN";

      return;

    }


    /* ==============================================
       LOGIN SUCCESS
    ============================================== */

    state.loggedIn=true;


    log(
      "✅ Login successful.",
      "ok"
    );


    /*
     * OPEN DASHBOARD IMMEDIATELY.
     *
     * Do NOT wait for WebSocket.
     * Do NOT wait for dashboard API.
     */

    openDashboard();


    /*
     * Start backend communication separately.
     */

    setTimeout(()=>{

      try{

        connect();

      }catch(error){

        console.error(
          "Connect error:",
          error
        );

        log(
          "WebSocket startup error: " +
          error.message,
          "error"
        );

      }

    },100);


    /*
     * Load dashboard separately.
     */

    setTimeout(()=>{

      loadDashboard();

    },150);


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    loginError.textContent =
      "Server unavailable. Check Render.";


    log(
      "Login request failed: " +
      error.message,
      "error"
    );


    loginButton.disabled=false;

    loginButton.textContent =
      "🔐 LOGIN";

  }

}


/* =========================================================
   OPEN DASHBOARD
========================================================= */

function openDashboard(){

  console.log(
    "🔥 OPENING DASHBOARD"
  );


  const loginScreen =
    $("loginScreen");

  const app =
    $("app");


  if(!loginScreen){

    console.error(
      "loginScreen element missing"
    );

    return;

  }


  if(!app){

    console.error(
      "app element missing"
    );

    return;

  }


  /* Hide login */

  loginScreen.classList.add(
    "hidden"
  );

  loginScreen.style.display =
    "none";


  /* Show application */

  app.classList.remove(
    "hidden"
  );

  app.style.display =
    "block";

  app.style.visibility =
    "visible";

  app.style.opacity =
    "1";

  app.style.minHeight =
    "100vh";


  document.body.style.overflowX =
    "hidden";


  console.log(
    "✅ DASHBOARD DOM IS VISIBLE"
  );


  log(
    "🔥 Dashboard opened.",
    "ok"
  );


  log(
    "Waiting for MT5 connection...",
    "info"
  );


  /*
   * Draw empty dashboard immediately.
   */

  setTimeout(
    drawChart,
    50
  );

}


/* =========================================================
   WEBSOCKET URL
========================================================= */

function websocketUrl(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  return (
    protocol +
    "//" +
    location.host +
    "/ws"
  );

}


/* =========================================================
   CONNECT
========================================================= */

function connect(){

  if(!state.loggedIn){

    return;

  }


  if(
    state.ws &&
    (
      state.ws.readyState ===
        WebSocket.OPEN ||

      state.ws.readyState ===
        WebSocket.CONNECTING
    )
  ){

    return;

  }


  clearTimeout(
    state.reconnectTimer
  );


  const url =
    websocketUrl();


  log(
    "Connecting WebSocket...",
    "info"
  );


  setConnection(
    false,
    "Connecting to server..."
  );


  try{

    state.ws =
      new WebSocket(url);

  }catch(error){

    console.error(
      "WebSocket create error:",
      error
    );

    log(
      "WebSocket creation failed.",
      "error"
    );

    scheduleReconnect();

    return;

  }


  state.ws.onopen=()=>{

    state.serverOnline=true;

    state.reconnectDelay=2000;

    state.reconnecting=false;


    setConnection(
      true,
      "Server connected"
    );


    log(
      "✅ WebSocket connected.",
      "ok"
    );


    sendSubscription();

  };


  state.ws.onmessage=event=>{

    try{

      const message =
        JSON.parse(
          event.data
        );

      handleWSMessage(
        message
      );

    }catch(error){

      console.warn(
        "Invalid WebSocket message:",
        event.data
      );

    }

  };


  state.ws.onerror=error=>{

    console.warn(
      "WebSocket error:",
      error
    );


    log(
      "WebSocket error.",
      "error"
    );


    setConnection(
      false,
      "WebSocket error"
    );

  };


  state.ws.onclose=event=>{

    state.serverOnline=false;


    setConnection(
      false,
      "Server disconnected"
    );


    log(
      "WebSocket disconnected (" +
      event.code +
      ").",
      "warn"
    );


    scheduleReconnect();

  };

}


/* =========================================================
   SUBSCRIBE
========================================================= */

function sendSubscription(){

  sendWS({

    type:"subscribe",

    symbol:
      state.selectedSymbol,

    timeframe:
      state.selectedTimeframe

  });

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect(){

  if(!state.loggedIn){

    return;

  }


  if(state.reconnecting){

    return;

  }


  state.reconnecting=true;


  clearTimeout(
    state.reconnectTimer
  );


  const delay =
    state.reconnectDelay;


  log(
    "Reconnecting in " +
    Math.round(delay/1000) +
    " seconds...",
    "warn"
  );


  state.reconnectTimer =
    setTimeout(
      ()=>{

        state.reconnecting=false;

        connect();

        state.reconnectDelay =
          Math.min(
            state.reconnectDelay * 2,
            30000
          );

      },
      delay
    );

}


/* =========================================================
   SEND WS
========================================================= */

function sendWS(payload){

  if(
    state.ws &&
    state.ws.readyState ===
      WebSocket.OPEN
  ){

    try{

      state.ws.send(
        JSON.stringify(payload)
      );

    }catch(error){

      log(
        "WebSocket send failed.",
        "error"
      );

    }

  }

}


/* =========================================================
   WS MESSAGE
========================================================= */

function handleWSMessage(message){

  if(!message){

    return;

  }


  console.log(
    "WS:",
    message
  );


  if(
    message.type === "mt5" ||
    message.type === "market" ||
    message.type === "tick"
  ){

    updateMT5(
      message.data ||
      message
    );

    return;

  }


  if(
    message.type === "dashboard" ||
    message.type === "state"
  ){

    updateDashboard(
      message.data ||
      message
    );

    return;

  }


  if(message.type === "ai"){

    updateAI(
      message.data ||
      message
    );

    return;

  }


  if(message.type === "news"){

    updateNews(
      message.data ||
      message
    );

    return;

  }


  if(message.type === "log"){

    log(
      message.message ||
      "Server event.",
      message.level ||
      "info"
    );

  }

}


/* =========================================================
   CONNECTION UI
========================================================= */

function setConnection(
  online,
  text
){

  const dot =
    $("connectionDot");

  const status =
    $("serverStatus");

  const connectionText =
    $("connectionText");


  if(!dot || !status || !connectionText){

    return;

  }


  if(online){

    dot.classList.add(
      "online"
    );

    status.classList.remove(
      "offline"
    );

    status.classList.add(
      "online"
    );

    status.textContent =
      "SERVER ONLINE";

  }else{

    dot.classList.remove(
      "online"
    );

    status.classList.remove(
      "online"
    );

    status.classList.add(
      "offline"
    );

    status.textContent =
      "SERVER OFFLINE";

  }


  connectionText.textContent =
    text || (
      online
        ? "Connected"
        : "Disconnected"
    );

}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadDashboard(){

  if(
    !state.loggedIn ||
    state.loadingDashboard
  ){

    return;

  }


  state.loadingDashboard=true;


  try{

    const response =
      await fetch(
        "/api/dashboard",
        {
          method:"GET",

          credentials:"include",

          cache:"no-store",

          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const raw =
      await response.text();


    console.log(
      "DASHBOARD HTTP:",
      response.status
    );


    let data={};

    try{

      data =
        JSON.parse(raw);

    }catch(error){

      console.error(
        "Dashboard JSON error:",
        raw
      );

      throw new Error(
        "Server returned invalid JSON"
      );

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        "Dashboard HTTP " +
        response.status
      );

    }


    updateDashboard(data);


    log(
      "✅ Dashboard data loaded.",
      "ok"
    );


  }catch(error){

    console.error(
      "Dashboard error:",
      error
    );


    log(
      "Dashboard API: " +
      error.message,
      "warn"
    );


    /*
     * Dashboard remains visible even
     * when MT5/backend data isn't ready.
     */

    $("finalReason").textContent =
      "Dashboard online. Waiting for MT5 data...";

  }finally{

    state.loadingDashboard=false;

  }

}


/* =========================================================
   REQUEST DASHBOARD
========================================================= */

let dashboardRequestTimer=null;

function requestDashboard(){

  clearTimeout(
    dashboardRequestTimer
  );


  dashboardRequestTimer =
    setTimeout(
      loadDashboard,
      250
    );

}

/* =========================================================
   MT5
========================================================= */

function updateMT5(data){

  if(!data){

    return;

  }


  const symbol =
    data.symbol ||
    data.Symbol ||
    state.selectedSymbol;


  $("priceSymbol").textContent =
    symbol;


  if(
    data.price !== undefined ||
    data.last !== undefined ||
    data.bid !== undefined
  ){

    const price =
      data.price ??
      data.last ??
      data.bid;


    $("livePrice").textContent =
      safeText(price);

  }


  $("priceBid").textContent =
    "Bid: " +
    safeText(
      data.bid ??
      data.Bid
    );


  $("priceAsk").textContent =
    "Ask: " +
    safeText(
      data.ask ??
      data.Ask
    );


  const spread =
    data.spread ??
    data.spreadPoints;


  $("spread").textContent =
    "Spread: " +
    safeText(spread);


  $("spreadTechnical").textContent =
    safeText(spread);


  $("tickValue").textContent =
    safeText(
      data.tick ??
      data.tickValue ??
      data.timestamp
    );


  const candles =
    data.candles ??
    data.rates ??
    data.ohlc;


  if(Array.isArray(candles)){

    state.candles =
      candles.slice(-500);


    $("candleCount").textContent =
      state.candles.length;

  }


  const online =
    data.connected === true ||
    data.online === true ||
    data.status === "online";


  if(online){

    state.mt5Online=true;


    $("mt5Status").className =
      "statusBadge online";


    $("mt5Status").textContent =
      "MT5 ONLINE";

  }


  if(
    data.timestamp ||
    data.time ||
    data.serverTime
  ){

    $("dataAge").textContent =
      "LIVE";

  }

}

/* =========================================================
   AI
========================================================= */

const AI_IDS={

  openai:"ai-openai",

  deepseek:"ai-deepseek",

  gemini:"ai-gemini",

  groq:"ai-groq",

  openrouter:"ai-openrouter",

  mistral:"ai-mistral"

};


const AI_NAMES={

  openai:"OpenAI",

  deepseek:"DeepSeek",

  gemini:"Gemini",

  groq:"Groq",

  openrouter:"OpenRouter",

  mistral:"Mistral AI"

};


function updateAI(data){

  if(!data){

    return;

  }


  let analysts=data;


  if(Array.isArray(data)){

    analysts={};


    data.forEach(item=>{

      const key =
        String(
          item.provider ||
          item.name ||
          ""
        ).toLowerCase();


      analysts[key]=item;

    });

  }


  Object.keys(AI_IDS)
    .forEach(key=>{

      const row =
        $(AI_IDS[key]);


      if(!row){

        return;

      }


      const item =
        analysts[key] ||
        analysts[AI_NAMES[key]] ||
        analysts[
          AI_NAMES[key].toLowerCase()
        ];


      if(!item){

        return;

      }


      const action =
        String(
          item.action ||
          item.decision ||
          item.signal ||
          "WAIT"
        ).toUpperCase();


      const confidence =
        item.confidence ??
        item.score ??
        0;


      const actionElement =
        row.querySelector(
          ".aiAction"
        );


      const confidenceElement =
        row.querySelector(
          ".aiConfidence"
        );


      if(actionElement){

        actionElement.textContent =
          action;


        setActionClass(
          actionElement,
          action
        );

      }


      if(confidenceElement){

        confidenceElement.textContent =
          "Confidence: " +
          percentage(confidence);

      }

    });


  $("aiStatus").textContent =
    "AI engine updated • " +
    new Date().toLocaleTimeString();

}

/* =========================================================
   NEWS
========================================================= */

function updateNews(data){

  if(!data){

    return;

  }


  const events =
    data.events ||
    data.items ||
    data.upcoming ||
    [];


  if(data.countdown !== undefined){

    $("newsCountdown").textContent =
      formatCountdown(
        data.countdown
      );

  }else if(
    data.minutesUntil !== undefined
  ){

    $("newsCountdown").textContent =
      formatMinutes(

    renderNewsEvents(events);

  }

}

/* =========================================================
   ACTION CLASS
========================================================= */

function setActionClass(
  element,
  action
){

  if(!element){

    return;

  }


  element.classList.remove(
    "good",
    "bad",
    "warn",
    "neutral"
  );


  const value =
    String(
      action || ""
    ).toUpperCase();


  if(value === "BUY"){

    element.classList.add("good");

  }else if(value === "SELL"){

    element.classList.add("bad");

  }else if(value === "WAIT"){

    element.classList.add("warn");

  }else{

    element.classList.add("neutral");

  }

}


/* =========================================================
   RSI COLOR
========================================================= */

function colorNumber(
  element,
  value
){

  if(!element){

    return;

  }


  const n =
    Number(value);


  element.classList.remove(
    "good",
    "bad",
    "warn"
  );


  if(!Number.isFinite(n)){

    return;

  }


  if(n >= 70){

    element.classList.add("bad");

  }else if(n <= 30){

    element.classList.add("good");

  }else{

    element.classList.add("warn");

  }

}


/* =========================================================
   CHART
========================================================= */

function drawChart(){

  const canvas =
    $("chart");


  if(!canvas){

    return;

  }


  const rect =
    canvas.getBoundingClientRect();


  const width =
    Math.max(
      300,
      rect.width || 300
    );


  const height =
    Math.max(
      200,
      rect.height || 290
    );


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    width * dpr;


  canvas.height =
    height * dpr;


  const ctx =
    canvas.getContext("2d");


  if(!ctx){

    return;

  }


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  ctx.fillStyle =
    "#05080d";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /* Grid */

  ctx.strokeStyle =
    "rgba(100,120,150,.12)";


  ctx.lineWidth=1;


  for(
    let x=0;
    x<width;
    x+=50
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(
      x,
      height
    );

    ctx.stroke();

  }


  for(
    let y=0;
    y<height;
    y+=45
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(
      width,
      y
    );

    ctx.stroke();

  }


  const candles =
    state.candles;


  if(
    !Array.isArray(candles) ||
    candles.length < 2
  ){

    ctx.fillStyle =
      "#59677b";


    ctx.font =
      "12px Arial";


    ctx.textAlign =
      "center";


    ctx.fillText(
      "Waiting for real MT5 candles...",
      width / 2,
      height / 2
    );


    return;

  }


  const points =
    candles
      .map(c=>
        Number(
          c.close ??
          c.Close ??
          c.price
        )
      )
      .filter(
        Number.isFinite
      );


  if(points.length < 2){

    return;

  }


  const visible =
    points.slice(-150);


  const min =
    Math.min(...visible);


  const max =
    Math.max(...visible);


  const range =
    max - min || 1;


  const pad=25;


  ctx.beginPath();


  visible.forEach(
    (price,index)=>{

      const x =
        pad +
        index *
        (
          (width - pad * 2) /
          Math.max(
            visible.length - 1,
            1
          )
        );


      const y =
        height -
        pad -
        (
          (price - min) /
          range
        ) *
        (
          height -
          pad * 2
        );


      if(index===0){

        ctx.moveTo(
          x,
          y
        );

      }else{

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.strokeStyle =
    "#00ff9d";


  ctx.lineWidth=2;

  ctx.stroke();


  const last =
    visible[
      visible.length - 1
    ];


  const lastY =
    height -
    pad -
    (
      (last - min) /
      range
    ) *
    (
      height -
      pad * 2
    );


  ctx.fillStyle =
    "#00ff9d";


  ctx.beginPath();

  ctx.arc(
    width - pad,
    lastY,
    4,
    0,
    Math.PI * 2
  );

  ctx.fill();

}


/* =========================================================
   PAPER TRADE
========================================================= */

function createPaperTrade(){

  const decision =
    state.dashboard?.finalDecision ||
    state.dashboard?.decision ||
    {};


  const action =
    String(
      decision.action ||
      decision.decision ||
      "WAIT"
    ).toUpperCase();


  if(
    action !== "BUY" &&
    action !== "SELL"
  ){

    log(
      "Paper trade blocked: final decision is WAIT.",
      "warn"
    );

    return;

  }


  const position={

    id:Date.now(),

    symbol:
      state.selectedSymbol,

    action,

    entry:
      decision.entry ??
      decision.entryPrice ??
      $("livePrice").textContent,

    sl:
      decision.sl ??
      decision.stopLoss ??
      "--",

    tp:
      decision.tp ??
      decision.takeProfit ??
      "--",

    time:
      new Date().toLocaleTimeString()

  };


  state.paperPositions.push(
    position
  );


  renderPositions();


  log(
    "Paper " +
    action +
    " created for " +
    position.symbol +
    ".",
    "ok"
  );

}

/* =========================================================
   LOG
========================================================= */

function log(
  message,
  level="info"
){

  const box =
    $("logBox");


  if(!box){

    return;

  }


  const line =
    document.createElement(
      "div"
    );


  line.className =
    "logLine " +
    level;


  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    String(message);


  box.appendChild(line);


  while(
    box.children.length > 300
  ){

    box.removeChild(
      box.firstChild
    );

  }


  box.scrollTop =
    box.scrollHeight;

}


/* =========================================================
   COUNTDOWN
========================================================= */

function formatCountdown(value){

  const n =
    Number(value);


  if(!Number.isFinite(n)){

    return "--";

  }


  const seconds =
    Math.max(
      0,
      Math.floor(n)
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    seconds % 60;


  return (
    String(minutes)
      .padStart(2,"0") +
    ":" +
    String(remaining)
      .padStart(2,"0")
  );

}


function formatMinutes(value){

  const n =
    Number(value);


  if(!Number.isFinite(n)){

    return "--";

  }


  if(n <= 0){

    return "RELEASED";

  }


  return (
    Math.floor(n) +
    " MIN"
  );

}
